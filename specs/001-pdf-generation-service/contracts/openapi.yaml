openapi: 3.1.0
info:
  title: inkpdf
  version: 0.1.0
  summary: Génération de PDF à partir de templates Typst, sans navigateur.
  description: |
    Service interne (VPC privé, sans authentification). Les templates sont lus à chaud
    depuis un volume monté ; l'appelant n'envoie que du JSON (`data` + `design`),
    validé contre le JSON Schema du template avant génération.
  license:
    name: TODO(LICENSE) — MIT OR Apache-2.0 proposé
servers:
  - url: http://localhost:3000
tags:
  - name: templates
  - name: render
  - name: ops
paths:
  /templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: Lister les templates du volume
      responses:
        "200":
          description: Templates connus, valides ou invalides, triés par identifiant.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/TemplateSummary" }
              example:
                templates:
                  - id: sample
                    name: Exemple
                    description: Titre et tableau de libellés/valeurs.
                    version: 1.0.0
                    status: valid
                  - id: broken
                    name: broken
                    status: invalid
                    reason: "schema.json: expected value at line 1 column 1"
  /templates/{templateId}:
    get:
      tags: [templates]
      operationId: getTemplate
      summary: Détail d'un template, schéma compris
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "200":
          description: Détail du template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDetail" }
        "404": { $ref: "#/components/responses/Problem" }
  /templates/{templateId}/schema:
    get:
      tags: [templates]
      operationId: getTemplateSchema
      summary: JSON Schema brut de l'entrée du template
      description: Utilisable directement par un validateur ou un générateur de formulaires.
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "200":
          description: JSON Schema (draft 2020-12).
          content:
            application/schema+json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /templates/{templateId}/render:
    post:
      tags: [render]
      operationId: renderTemplate
      summary: Générer un PDF
      description: |
        Valide le corps contre le schéma du template (après application des valeurs
        `default` de `design`), puis renvoie le PDF. Aucune génération n'est tentée si la
        validation échoue.
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenderRequest" }
            example:
              data:
                title: Exemple
                items:
                  - { label: Alpha, value: 2 }
              design:
                primaryColor: "#c0392b"
                showFooter: false
      responses:
        "200":
          description: Document généré.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: inline; filename="sample.pdf"
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422":
          description: Corps non conforme au schéma du template.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: https://github.com/ck-developer/inkpdf/errors/validation-failed
                title: Validation failed
                status: 422
                code: validation-failed
                detail: 2 violations
                templateId: sample
                violations:
                  - path: /data/items/0/value
                    schemaPath: /properties/data/properties/items/items/properties/value/minimum
                    message: -1 is less than the minimum of 0
                  - path: /design/align
                    schemaPath: /properties/design/properties/align/enum
                    message: '"top" is not one of ["left","center","right"]'
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "504": { $ref: "#/components/responses/Problem" }
  /health:
    get:
      tags: [ops]
      operationId: health
      summary: Vivacité du processus
      responses:
        "200":
          description: Le processus répond.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /ready:
    get:
      tags: [ops]
      operationId: ready
      summary: Disponibilité (scan initial du volume terminé)
      responses:
        "200":
          description: Prêt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Scan initial en cours.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /openapi.json:
    get:
      tags: [ops]
      operationId: openapi
      summary: Ce document, au format JSON
      responses:
        "200":
          description: Document OpenAPI 3.1.
          content:
            application/json:
              schema: { type: object }
components:
  parameters:
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$" }
      example: sample
  responses:
    Problem:
      description: Erreur au format RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    TemplateStatus:
      type: string
      enum: [valid, invalid]
    TemplateSummary:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        status: { $ref: "#/components/schemas/TemplateStatus" }
        reason:
          type: string
          description: Présent si `status` vaut `invalid`.
    TemplateDetail:
      allOf:
        - $ref: "#/components/schemas/TemplateSummary"
        - type: object
          required: [loadedAt]
          properties:
            loadedAt: { type: string, format: date-time }
            schema:
              type: object
              description: JSON Schema de l'entrée (absent si le template est invalide).
            links:
              type: object
              properties:
                schema: { type: string, example: /templates/sample/schema }
                render: { type: string, example: /templates/sample/render }
    RenderRequest:
      type: object
      description: |
        Forme générique ; la forme exacte de `data` et `design` est donnée par le schéma
        du template (`GET /templates/{templateId}/schema`).
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          description: Données métier.
        design:
          type: object
          description: Paramètres de design ; les propriétés absentes prennent leur `default`.
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum:
            - template-not-found
            - invalid-json
            - unsupported-media-type
            - validation-failed
            - payload-too-large
            - template-invalid
            - render-failed
            - render-timeout
            - overloaded
        templateId: { type: string }
        violations:
          type: array
          items: { $ref: "#/components/schemas/Violation" }
        diagnostics:
          type: array
          items: { $ref: "#/components/schemas/Diagnostic" }
    Violation:
      type: object
      required: [path, schemaPath, message]
      properties:
        path: { type: string, description: JSON Pointer dans le corps de la requête }
        schemaPath: { type: string, description: JSON Pointer dans le schéma }
        message: { type: string }
    Diagnostic:
      type: object
      required: [message]
      properties:
        message: { type: string }
        file: { type: string, description: Chemin relatif au dossier du template }
        line: { type: integer }
        column: { type: integer }
        hints:
          type: array
          items: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, starting] }
        templates: { type: integer, description: Nombre de templates valides }
        version: { type: string }
