name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got (status code, problem+json body, logs).
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal template (main.typ + schema.json) and request body, or the steps.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag (e.g. `0.2.0`, `dev`) or commit.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment
      description: Docker / Kubernetes / binary, architecture, relevant INKPDF_* variables.
