name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like inkpdf to do? Keep in mind that inkpdf is content-agnostic.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
