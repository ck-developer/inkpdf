version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
    # Typst crates are pinned on purpose (=X.Y.Z): bump them deliberately, with the bundled
    # packages verified against the new engine.
    ignore:
      - dependency-name: "typst*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
