name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A merged release PR: publish X.Y.Z, X.Y and latest.
  image:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}
      version: ${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}.${{ needs.release-please.outputs.patch }}
      tags: |
        ${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}.${{ needs.release-please.outputs.patch }}
        ${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
        latest
