name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the in-progress run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Tests
        run: cargo test --workspace
      - name: Bundled packages
        run: cargo xtask packages verify

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf
      # Only the performance test binary is compiled in release mode.
      - name: Performance tests
        run: cargo test --release -p inkpdf --test perf -- --ignored

  # Every green push to main republishes the `dev` image (no per-commit tags).
  publish-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, perf]
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-dev
      cancel-in-progress: true
    uses: ./.github/workflows/image.yml
    with:
      tags: dev
