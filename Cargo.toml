[workspace]
members = ["crates/inkpdf", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ck-developer/inkpdf"

[workspace.lints.rust]
unsafe_code = "forbid"

# Docker image profile (`cargo build --profile dist`): stripped binary with LTO, to keep
# the image under 100 MB (SC-009). Separate from `release` so that release-mode tests
# (the performance guard) stay quick to compile.
[profile.dist]
inherits = "release"
strip = true
lto = "thin"
codegen-units = 1
