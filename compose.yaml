# Local test environment: `docker compose up --build`, then http://localhost:3000/docs
#
# Templates are read from the host folder named by INKPDF_TEMPLATES (./examples/templates
# by default); adding, editing or removing a template in that folder is picked up live,
# without restarting the container.
services:
  inkpdf:
    build: .
    image: inkpdf:dev
    ports:
      - "${INKPDF_PORT:-3000}:3000"
    volumes:
      - "${INKPDF_TEMPLATES:-./examples/templates}:/templates:ro"
    environment:
      INKPDF_LOG_FORMAT: "${INKPDF_LOG_FORMAT:-pretty}"
      RUST_LOG: "${RUST_LOG:-info}"
      INKPDF_RENDER_TIMEOUT_SECS: "${INKPDF_RENDER_TIMEOUT_SECS:-30}"
      INKPDF_MAX_BODY_BYTES: "${INKPDF_MAX_BODY_BYTES:-5242880}"
    restart: unless-stopped
