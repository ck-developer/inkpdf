[package]
name = "xtask"
version = "0.0.0"
description = "Maintainer commands for the inkpdf repository (packages, docs)."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "1.1"
typst-syntax = "=0.15.1"
ureq = { version = "2", default-features = false, features = ["tls"] }
