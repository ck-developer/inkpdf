[package]
name = "inkpdf"
version = "0.1.0"
description = "PDF generation service from Typst templates, without a browser."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "inkpdf"
path = "src/main.rs"

[[bench]]
name = "render"
harness = false

[dependencies]
typst = "=0.15.1"
typst-pdf = "=0.15.1"
# `PagedDocument` lives in typst-layout and is not re-exported by `typst`.
typst-layout = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["embedded-fonts"] }
comemo = "0.5"
axum = "0.8.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net", "io-util"] }
tower-http = { version = "0.7", features = ["trace"] }
utoipa = { version = "=6.0.0", features = ["axum_extras"] }
utoipa-axum = "=0.3.0"
jsonschema = { version = "=0.58.6", default-features = false }
notify = "8.2"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
time = { version = "0.3", features = ["formatting"] }
regex = "1"
num_cpus = "1"

# Embedded Typst packages: verified and extracted by build.rs (specs/002-typst-packages, R1).
[build-dependencies]
flate2 = "1.1"
tar = "0.4"
sha2 = "0.11"
toml = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
sha2 = "0.11"
toml = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
pdf-extract = "0.12"
criterion = "0.8"
